# Gera o executável único para Windows e Linux.
# O resultado fica em "Artifacts" na página da execução (aba Actions).
name: build

on:
  push:
  workflow_dispatch:

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: agente/go.mod
          cache-dependency-path: agente/go.sum
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.44.9
          cache: true
      - name: Build
        run: powershell -ExecutionPolicy Bypass -File scripts\build-windows.ps1
      - uses: actions/upload-artifact@v4
        with:
          name: teclado-scanner-windows
          path: dist/teclado-scanner.exe

  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: agente/go.mod
          cache-dependency-path: agente/go.sum
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.44.9
          cache: true
      - name: Dependências
        run: sudo apt-get update && sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev zip
      - name: Testes
        run: cd agente && go test ./...
      - name: Build
        run: ./scripts/build-linux.sh
      - uses: actions/upload-artifact@v4
        with:
          name: teclado-scanner-linux
          path: dist/teclado-scanner
